<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="meta.itemFallbackTitle">İçerik · MehburMC Kütüphane</title>
    <meta
      name="description"
      data-i18n-attr="content:meta.libraryDescription"
      content="MehburMC topluluğunun onaylı modları, modpack'leri, resource pack'leri ve shader'ları. Ara, filtrele ve giriş yapmadan indir."
    />
    <meta name="theme-color" content="#05070a" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Tema, sayfa çizilmeden önce ayarlanır (bkz. index.html) -->
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("mmclib.theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <script type="module" src="/src/pages/item.ts"></script>
  </head>
  <body>
    <header data-shell="header"></header>

    <main id="main">
      <section class="section page-section">
        <div class="container">
          <a class="back-link" href="/library/">
            <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            <span data-i18n="item.back">Kütüphaneye dön</span>
          </a>
          <div class="item-page" data-item aria-busy="true">
            <p class="results-status" role="status" data-i18n="item.loading">İçerik yükleniyor…</p>
          </div>
        </div>
      </section>
    </main>

    <footer data-shell="footer"></footer>
  </body>
</html>
