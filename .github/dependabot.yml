# Dependabot: bağımlılıklar ve GitHub Actions eklentileri için haftalık güncelleme PR'ları
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # @types/node, kullanılan Node sürümüyle (24) aynı major'da kalmalı;
      # Node yükseltildiğinde bu kural da elle güncellenir
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
